name: CI

# Every push to main and every pull request: build and test each package on every
# Node.js version the packages support, then pack them the way a release does and
# install the tarballs into an empty project with npm and with pnpm.
#
# Actions are pinned to commit SHAs, with the version each one corresponds to in
# the trailing comment. A tag is a pointer its owner can move, and this workflow
# builds code people install. Upgrade deliberately: bump the SHA and the comment
# together.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No version input: pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  package:
    name: Pack and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packs every package with its sibling URLs pointed at a local server, then
      # installs from that server with the package scope's registry unreachable,
      # so a sibling resolved by name rather than by URL fails here.
      - run: node scripts/verify-install.mjs --local
