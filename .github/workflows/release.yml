name: Release

# Publishes the version every package carries as GitHub Release vX.Y.Z on this
# repository: one tarball per package, SHA256SUMS, and a build provenance
# attestation for each tarball. Nothing goes to a registry.
#
# Run it from the Actions tab, on main, once the sync carrying the new version and
# its CHANGELOG.md entry has merged. The build job runs straight away; the publish
# job waits for a reviewer on the `release` environment, who can download the
# built assets from this run before approving.
#
# Two repository settings carry the guarantees, and the jobs refuse to go on
# without them:
#   - the `release` environment has required reviewers. GitHub creates an
#     environment that does not exist yet, unprotected, the first time a job
#     names it, so the build job checks for the reviewers first;
#   - immutable releases are on, so a published release's tag and assets cannot
#     change and an install URL keeps meaning the same bytes. A release that
#     comes out mutable is withdrawn and the publish job fails.
#
# Nothing here is cached: a release builds from the lockfile alone. Actions are
# pinned to commit SHAs, as in ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build the release assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse to release from a branch other than the default
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "Releases are cut from $DEFAULT_BRANCH; this run is on $BRANCH." >&2
          exit 1

      - name: Refuse to publish without reviewers on the release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[]?.type] | join(",")') || rules=""
          case ",$rules," in
          *,required_reviewers,*) ;;
          *)
            echo "The release environment has no required reviewers, so nothing would stop an unreviewed publish. Add them under Settings > Environments > release, then run the release again." >&2
            exit 1
            ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./packages/sdk-js/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse a version that is already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released. Set the next version upstream, sync it, then release." >&2
            exit 1
          fi

      # Refuses packages that disagree on their version, a package without its
      # licence, and a version CHANGELOG.md has no entry for.
      - name: Pack the assets
        run: node scripts/pack-release.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist-release/
          if-no-files-found: error

  publish:
    name: Publish v${{ needs.build.outputs.version }}
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the release and its tag
      id-token: write # signing the provenance attestations
      attestations: write # storing them
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist-release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*.tgz

      # A draft first, because a published release takes no more assets once it
      # is immutable. The tag is created on the commit this run built when the
      # draft is published.
      - name: Create the release as a draft
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file dist-release/notes.md dist-release/*.tgz dist-release/SHA256SUMS

      - name: Publish it
        run: gh release edit "v$VERSION" --draft=false

      - name: Withdraw it unless it is immutable
        run: |
          if [ "$(gh release view "v$VERSION" --json isImmutable --jq .isImmutable)" != "true" ]; then
            gh release delete "v$VERSION" --yes --cleanup-tag
            echo "v$VERSION came out mutable, so it was withdrawn. Turn on immutable releases under Settings > General > Releases, then run the release again." >&2
            exit 1
          fi

  verify:
    name: Install v${{ needs.build.outputs.version }} from the release
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The same install an integrator runs, from the live URLs, with the package
      # scope's registry unreachable.
      - name: Install from the published release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/verify-install.mjs --release "$VERSION"
